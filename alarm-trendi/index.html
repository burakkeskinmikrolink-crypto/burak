<title>Haftalık Alarm Trendi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-slide NOC report: header, 4 KPI tiles, total bar chart (left) + 3x2 alarm small multiples (right), source table below */
:root {
  --bg: #ffffff;
  --surface: #f4f6f9;
  --fg: #16191f;
  --fg-2: #4a5160;
  --muted: #8a92a3;
  --grid: #e3e7ee;
  --bar: #bcd3ee;
  --bar-hi: #2a77d6;
  --line: #5b86c4;
  --area: rgba(91,134,196,.10);
  --up: #d23a33;
  --up-area: rgba(210,58,51,.10);
  --down: #1d8a4e;
  --flat: #8a92a3;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1b2029; --fg: #eef1f6; --fg-2: #b4bccb; --muted: #7e8798; --grid: #2a313d;
  --bar: #34506f; --bar-hi: #4f97ee; --line: #7ea6dd; --area: rgba(126,166,221,.12);
  --up: #f0665e; --up-area: rgba(240,102,94,.14); --down: #3dbb75; --flat: #7e8798; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b2029; --fg: #eef1f6; --fg-2: #b4bccb; --muted: #7e8798; --grid: #2a313d;
  --bar: #34506f; --bar-hi: #4f97ee; --line: #7ea6dd; --area: rgba(126,166,221,.12);
  --up: #f0665e; --up-area: rgba(240,102,94,.14); --down: #3dbb75; --flat: #7e8798; color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--font); font-variant-numeric: tabular-nums; }
.page { max-width: 1440px; margin: 0 auto; padding-block: 40px 32px; padding-inline: clamp(16px, 4vw, 64px); display: grid; gap: 36px; }

header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
h1 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; text-wrap: balance; }
.sub { color: var(--fg-2); font-size: clamp(14px, 1.4vw, 18px); margin: 0; }
.org { color: var(--muted); font-size: 16px; padding-top: 10px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 20px; }
.kpi { background: var(--surface); border-radius: 10px; padding: 18px 24px 20px; display: grid; gap: 6px; }
.kpi .lbl { color: var(--fg-2); font-size: 15px; }
.kpi .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kpi .big { font-size: clamp(40px, 4.4vw, 58px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.kpi .note { color: var(--fg-2); font-size: 15px; }
.good { color: var(--down); } .bad { color: var(--up); }

.main { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 48px; }
h2 { font-size: 20px; font-weight: 600; margin: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.legend { color: var(--fg-2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.legend b { font-weight: 600; }

.multiples { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 28px 28px; }
.sm h3 { font-size: 14px; font-weight: 500; color: var(--fg-2); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm .vals { display: flex; align-items: baseline; gap: 14px; }
.sm .num { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
.sm .delta { font-size: 14px; font-weight: 600; }
.sm .delta span { font-weight: 400; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font); }

.foot { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; font-size: 13px; }
tfoot td { font-weight: 700; border-bottom: none; }
td.up { color: var(--up); font-weight: 600; }
td.last { background: var(--surface); }
details summary { cursor: pointer; color: var(--fg-2); font-size: 14px; font-weight: 500; }
details summary:focus-visible { outline: 2px solid var(--bar-hi); outline-offset: 3px; }

#tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 13px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; z-index: 10; }

@media (max-width: 1100px) { .main { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px) { .multiples { grid-template-columns: repeat(2, minmax(0,1fr)); } .kpis { grid-template-columns: 1fr; } }
</style>

<div class="page">
  <header>
    <div>
      <h1>Haftalık Alarm Trendi</h1>
      <p class="sub">7 Eylül – 12 Ekim 2026 &nbsp;·&nbsp; Son 6 hafta &nbsp;·&nbsp; Alarm adedi</p>
    </div>
    <div class="org">Mikrolink R1 NOC</div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="main">
    <div>
      <div class="panel-head"><h2>Toplam alarm</h2></div>
      <svg id="bars" viewBox="0 0 620 470" role="img" aria-label="Haftalık toplam alarm sayısı"></svg>
      <p class="foot">Kaynak: Haftalık alarm takip tablosu. Toplamlar tablodaki Grand Total satırıdır.</p>
    </div>
    <div>
      <div class="panel-head">
        <h2>Alarm bazında</h2>
        <div class="legend"><span class="bad"><b>▲</b> <span style="color:var(--fg-2)">kırmızı: geçen haftaya göre artış</span></span><span class="good"><b>▼</b> <span style="color:var(--fg-2)">yeşil: azalış</span></span></div>
      </div>
      <div class="multiples" id="multiples"></div>
    </div>
  </section>

  <details>
    <summary>Kaynak tablo</summary>
    <div class="tbl-wrap"><table id="tbl"></table></div>
  </details>
</div>
<div id="tip" hidden></div>

<script>
const WEEKS = ["7 Eyl","14 Eyl","21 Eyl","28 Eyl","5 Eki","12 Eki"];
const WEEKS_FULL = ["7.09.2026","14.09.2026","21.09.2026","28.09.2026","5.10.2026","12.10.2026"];
const ALARMS = [
  ["External Clock Reference Problem", [90,86,94,88,104,90], "Ext. Clock"],
  ["RF Unit VSWR Threshold Crossed",   [99,88,76,65,51,42],  "VSWR"],
  ["IP PM Activation Failure",         [32,30,28,5,19,17],   "IP PM"],
  ["BBU CPRI Interface Error",         [21,18,14,11,9,6],    "CPRI Interface"],
  ["RF Unit Maintenance Link Failure", [11,12,9,8,6,5],      "RF Maint. Link"],
  ["BBU CPRI Optical Module Fault",    [2,1,1,0,0,0],        "CPRI Optical"],
];
const TOTAL = [323,294,233,177,189,160];
const N = TOTAL.length, L = N - 1;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent && parent.appendChild(e); return e; };
const pct = (a, b) => Math.round((b - a) / a * 100);
const sign = v => v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0";

/* KPI tiles */
const total6 = pct(TOTAL[0], TOTAL[L]), wow = pct(TOTAL[L-1], TOTAL[L]);
const risers = ALARMS.filter(a => a[1][L] > a[1][L-1]);
const kpis = [
  ["12 Ekim toplam", TOTAL[L], "", ""],
  ["6 haftalık değişim", sign(total6) + "%", `${TOTAL[0]} → ${TOTAL[L]}`, total6 < 0 ? "good" : "bad"],
  ["Geçen haftaya göre", sign(wow) + "%", `${TOTAL[L-1]} → ${TOTAL[L]}`, wow < 0 ? "good" : "bad"],
  ["Artış gösteren alarm", risers.length, risers.length ? risers.map(a => a[2]).join(" · ") : "Tüm alarmlar azaldı veya sabit", risers.length ? "bad" : "good"],
];
document.getElementById("kpis").innerHTML = kpis.map(([l, v, n, c]) =>
  `<div class="kpi"><div class="lbl">${l}</div><div class="row"><div class="big ${c}">${v}</div><div class="note">${n}</div></div></div>`).join("");

/* Total bar chart */
(() => {
  const svg = document.getElementById("bars");
  const W = 620, H = 470, m = { l: 44, r: 8, t: 40, b: 40 };
  const max = 350, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const y = v => m.t + ph - v / max * ph;
  [0,100,200,300].forEach(t => {
    el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: m.l - 10, y: y(t) + 5, "text-anchor": "end", fill: "var(--muted)", "font-size": 14 }, svg, t);
  });
  const band = pw / N, bw = band * 0.62;
  TOTAL.forEach((v, i) => {
    const x = m.l + band * i + (band - bw) / 2, top = y(v), base = y(0), r = 4;
    const g = el("g", { "data-tip": `${WEEKS_FULL[i]}: ${v} alarm` }, svg);
    el("rect", { x: x - 4, y: m.t, width: bw + 8, height: ph, fill: "transparent" }, g);
    el("path", { d: `M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z`,
      fill: i === L ? "var(--bar-hi)" : "var(--bar)" }, g);
    el("text", { x: x + bw / 2, y: top - 12, "text-anchor": "middle", fill: "var(--fg)", "font-size": 20, "font-weight": i === L ? 700 : 500 }, g, v);
    el("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", fill: "var(--fg-2)", "font-size": 15 }, g, WEEKS[i]);
  });
})();

/* Small multiples */
(() => {
  const host = document.getElementById("multiples");
  ALARMS.forEach(([name, d]) => {
    const diff = d[L] - d[L-1];
    const cls = diff > 0 ? "bad" : diff < 0 ? "good" : "";
    const delta = diff > 0 ? `▲ +${diff} <span>geçen hafta</span>` : diff < 0 ? `▼ −${-diff} <span>geçen hafta</span>` : `<span style="color:var(--flat)">■ değişim yok</span>`;
    const card = document.createElement("div");
    card.className = "sm";
    card.innerHTML = `<h3 title="${name}">${name}</h3><div class="vals"><div class="num">${d[L]}</div><div class="delta ${cls}">${delta}</div></div>`;
    host.appendChild(card);

    const W = 300, H = 150, m = { l: 30, r: 10, t: 22, b: 30 };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${name}: ${d.join(", ")}` }, card);
    const max = Math.max(...d) * 1.08 || 1, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const x = i => m.l + pw * i / L, y = v => m.t + ph - v / max * ph;
    const col = diff > 0 ? "var(--up)" : "var(--line)", area = diff > 0 ? "var(--up-area)" : "var(--area)";
    el("line", { x1: m.l, x2: W - m.r, y1: y(0), y2: y(0), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const pts = d.map((v, i) => `${x(i)},${y(v)}`).join(" L");
    el("path", { d: `M${x(0)},${y(0)} L${pts} L${x(L)},${y(0)} Z`, fill: area }, svg);
    el("path", { d: `M${pts}`, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    d.forEach((v, i) => {
      const g = el("g", { "data-tip": `${WEEKS_FULL[i]}: ${v}` }, svg);
      el("circle", { cx: x(i), cy: y(v), r: 12, fill: "transparent" }, g);
      el("circle", { cx: x(i), cy: y(v), r: i === L ? 5 : 4, fill: i === L ? col : "var(--bg)", stroke: i === L ? "var(--bg)" : col, "stroke-width": i === L ? 2 : 1.6 }, g);
    });
    el("text", { x: x(0) - 8, y: y(d[0]) + 4, "text-anchor": "end", fill: "var(--fg-2)", "font-size": 12 }, svg, d[0]);
    el("text", { x: m.l, y: H - 6, fill: "var(--muted)", "font-size": 12 }, svg, WEEKS[0]);
    el("text", { x: W - m.r, y: H - 6, "text-anchor": "end", fill: "var(--muted)", "font-size": 12 }, svg, WEEKS[L]);
  });
})();

/* Source table */
(() => {
  const head = `<thead><tr><th>Alarm</th>${WEEKS_FULL.map(w => `<th>${w}</th>`).join("")}</tr></thead>`;
  const body = ALARMS.map(([name, d]) => `<tr><td>${name}</td>${d.map((v, i) =>
    `<td class="${i && v > d[i-1] ? "up" : ""} ${i === L ? "last" : ""}">${v}</td>`).join("")}</tr>`).join("");
  const foot = `<tfoot><tr><td>Grand Total</td>${TOTAL.map((v, i) => `<td class="${i && v > TOTAL[i-1] ? "up" : ""} ${i === L ? "last" : ""}">${v}</td>`).join("")}</tr></tfoot>`;
  document.getElementById("tbl").innerHTML = head + `<tbody>${body}</tbody>` + foot;
})();

/* Hover tooltip */
(() => {
  const tip = document.getElementById("tip");
  document.addEventListener("mousemove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute("data-tip");
    tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (e.clientY - 36) + "px";
  });
})();
</script>
